<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <!-- Heading -->
                <h1 class="text-center mb-4 fw-bold">📝 My To-Do List</h1>

                <!-- Add Task Form -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form action="/add" method="POST" class="d-flex gap-2">
                            <input 
                                type="text" 
                                name="title" 
                                class="form-control" 
                                placeholder="Enter a task..." 
                                required>
                            <button type="submit" class="btn btn-success px-4">
                                Add
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Task List -->
                {% if tasks %}
                <ul class="list-group shadow-sm">
                    {% for task in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        
                        <!-- Task Title -->
                        <span class="{{ 'text-decoration-line-through text-muted' if task['done'] else 'fw-medium' }}">
                            {{ task['title'] }}
                        </span>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            {% if not task['done'] %}
                            <a href="/complete/{{ task['id'] }}" class="btn btn-primary btn-sm">
                                ✔ Done
                            </a>
                            {% else %}
                            <span class="badge bg-success">Completed</span>
                            {% endif %}
                            <a href="/delete/{{ task['id'] }}" class="btn btn-danger btn-sm">
                                🗑 Delete
                            </a>
                        </div>

                    </li>
                    {% endfor %}
                </ul>
                {% else %}
                <!-- Empty State -->
                <div class="text-center text-muted mt-5">
                    <h5>No tasks yet! Add one above 👆</h5>
                </div>
                {% endif %}

            </div>
        </div>
    </div>

</body>
</html>
